<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关于寻找自己 — DONGGUI</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/png" href="favicon.png"></head><body><div class="wrap"><header class="nav"><a class="brand" href="index.html">DONGGUI</a><nav class="navlinks"><a href="about.html">About</a><a href="notes.html">Notes</a><a href="books.html">Books</a><a href="deutsch.html">Deutsch</a></nav></header><main class="article"><a class="back" href="notes.html">← Notes</a><div class="eyebrow" style="margin-top:40px">2026.10 / NOTE 001</div><h1>关于寻找自己</h1><p>“You must find yourself.”</p><p>真正重要的问题，往往不是别人希望你成为什么，而是你愿意用怎样的时间，慢慢成为怎样的人。</p><p>所以我想把这个网站做成一个安静的地方。这里可以有阅读，可以有语言学习，可以有偶尔写下来的句子。它们不需要立刻产生什么结果，只需要真实存在过。</p><p>如果多年以后再次打开这里，希望还能看见一些当时的自己。</p></main><footer class="footer"><div>© 2026 DONGGUI</div><div>Made for the journey.</div></footer></div></body></html>
